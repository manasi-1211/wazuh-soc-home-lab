# SSH hardening change on kali-lab (Part 4: SCA check 36144)
# File: /etc/ssh/sshd_config
# CIS recommendation: "Ensure SSH MaxAuthTries is set to 4 or less"

# BEFORE: commented-out default, so SSH used the built-in default of 6
#MaxAuthTries 6

# AFTER: active setting
MaxAuthTries 4

# Verify, then apply:
#   sudo sshd -t                          (no output = valid syntax)
#   sudo sshd -T | grep '^maxauthtries'   (should show: maxauthtries 4)
#   sudo systemctl restart ssh
